plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mixin {
        // Loom 1.14 ships with the legacy mixin annotation processor DISABLED, which
        // means mixin string targets (method/field names) are never remapped into the
        // refmap - and in a production (obfuscated) runtime EVERY injection then fails
        // silently. Enabling it produces zephyr-refmap.json, so the mixins actually
        // apply outside the dev environment (freelook, nodelay, jump reset, ...).
        useLegacyMixinAp = true
        defaultRefmapName = 'zephyr-refmap.json'
        add(sourceSets.main, 'zephyr-refmap.json')
    }
}

repositories {
    maven { name = 'CentralMirror'; url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
    mavenCentral()
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Practice-bot test only (see PracticeBotTest): -Pherobot=<path to the HeroBot jar>.
    if (project.hasProperty("herobot")) {
        modLocalRuntime files(project.property("herobot"))
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

// Test harnesses stay out of what is released; development runs use the class folders.
tasks.named('jar') {
    exclude 'dev/zephyr/HitCrystalTest*', 'dev/zephyr/PracticeBotTest*', 'dev/zephyr/SmartMaceArena*',
            'dev/zephyr/FeatureTour*', 'dev/zephyr/DuelTest*', 'dev/zephyr/ChaseCheck*'
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

loom {
    runs {
        // AutoCrystalPvP against ElytraMaceBot over LAN (see DuelTest and hct-out/run-duel.sh).
        ["host": "Crystal", "guest": "Mace"].each { role, user ->
            "duel${role.capitalize()}" {
                client()
                runDir "run-duel-${role}"
                ideConfigGenerated false
                property "zephyr.duel", role
                property "zephyr.duel.dir", file("hct-out/duel").absolutePath
                ["rounds", "ticks"].each {
                    def v = System.getProperty("zephyr.duel.${it}")
                    if (v) property "zephyr.duel.${it}", v
                }
                programArgs "--username", user
                if (role == "guest") programArgs "--quickPlayMultiplayer", "localhost:25591"
            }
        }
        // Two-instance AutoHitCrystal test (see HitCrystalTest): run hctHost, then hctVictim.
        ["host": "Hunter", "victim": "Victim"].each { role, user ->
            "hct${role.capitalize()}" {
                client()
                runDir "run-hct-${role}"
                ideConfigGenerated false
                property "zephyr.hct", role
                property "zephyr.hct.dir", file("hct-out").absolutePath
                ["trace", "floors", "modes", "reps", "kits"].each {
                    def v = System.getProperty("zephyr.hct.${it}")
                    if (v) property "zephyr.hct.${it}", v
                }
                programArgs "--username", user
                if (role == "victim") programArgs "--quickPlayMultiplayer", "localhost:25590"
            }
        }
        // Theobald practice-bot fight (see PracticeBotTest); world copy in run-pbt/saves/theo.
        pbt {
            client()
            runDir "run-pbt"
            ideConfigGenerated false
            property "zephyr.pbt", "true"
            property "zephyr.pbt.dir", file("hct-out/pbt").absolutePath
            ["trace", "lead", "ticks", "ui", "set", "style", "hug", "ledge", "label", "bench", "with", "guard", "terrain", "buildmap", "speed", "smart", "sceneticks", "rounds", "features", "chase"].each {
                def v = System.getProperty("zephyr.pbt.${it}")
                if (v) property "zephyr.pbt.${it}", v
            }
            programArgs "--quickPlaySingleplayer", "theo"
        }
        client {
            client()
            property "java.awt.headless", "false"
            if (System.getProperty("zephyr.elytratest")) {
                property "zephyr.elytratest", "1"
                property "zephyr.scen", System.getProperty("zephyr.scen") ?: "still,walk,strafe,dodge"
                property "zephyr.reps", System.getProperty("zephyr.reps") ?: "1"
                if (System.getProperty("zephyr.ebtdebug")) {
                    property "zephyr.ebtdebug", "true"
                }
                if (System.getProperty("zephyr.ebtset")) {
                    property "zephyr.ebtset", System.getProperty("zephyr.ebtset")
                }
                if (System.getProperty("zephyr.drift")) {
                    property "zephyr.drift", System.getProperty("zephyr.drift")
                }
                if (System.getProperty("zephyr.explore")) {
                    property "zephyr.explore", System.getProperty("zephyr.explore")
                }
                if (System.getProperty("zephyr.secs")) {
                    property "zephyr.secs", System.getProperty("zephyr.secs")
                }
                programArgs "--quickPlaySingleplayer", "ZephyrTest"
            }
        }
    }
}

